# =============================================================================
# InteriMatch AI - Docker Compose (développement)
# =============================================================================
# Usage : docker compose up -d
# =============================================================================

services:
  # --- Base de données PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interimatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interimatch}
      POSTGRES_DB: ${POSTGRES_DB:-interimatch}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interimatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis (cache & tâches) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend FastAPI ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-interimatch}:${POSTGRES_PASSWORD:-interimatch}@db:5432/${POSTGRES_DB:-interimatch}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Frontend Next.js ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # --- Ollama (LLM local, OPTIONNEL) ---
  # À activer avec : docker compose --profile ollama up -d
  # Si ce profil n'est pas activé, ces services ne démarrent pas et n'occupent
  # aucune ressource (utile si on utilise un LLM en ligne : Groq, Mistral, etc.)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Télécharge automatiquement le modèle au premier démarrage puis s'arrête.
  # Modèle par défaut : qwen2.5:7b (~4.7 Go) — excellent rapport intelligence/taille,
  # très bon en français et en sortie JSON structurée (idéal pour extraction CV).
  # Alternatives : qwen2.5:3b (~2 Go, plus léger), llama3.1:8b (~4.9 Go), mistral:7b.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
    entrypoint: /bin/sh
    command:
      - -c
      - 'ollama pull "$$OLLAMA_MODEL" && echo "[ollama-init] Modele pret => $$OLLAMA_MODEL"'
    restart: "no"

volumes:
  pgdata:
  uploads:
  ollama_data:
